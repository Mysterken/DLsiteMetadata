2Fplay.dlsite.com\u002F?workno=RJ01034407",{"is_success":30,"error_msg":7,"product_id":10,"product_name":11,"is_reserve":20,"review_deny":20,"mix_pickup":30,"order":314,"limit":85,"page":16,"review_list":315,"count":129,"reviewer_genre_list":413,"has_paging":30},"top",[316,342,359,374,389,401],{"member_review_id":317,"workno":10,"reviewer_id":318,"status":319,"recommend":30,"spoiler":30,"review_title":320,"review_text":321,"entry_date":322,"regist_date":323,"good_review":117,"bad_review":324,"circle_id":47,"nick_name":325,"popularity":8,"rate":326,"circle_name":147,"top_sort_key":319,"reviewer_status":327,"is_purchased":30,"rate_num":328,"reviewer_rank":7,"longtext":30,"genre":329,"original_lang":336,"translations":337,"pickup":20},"1132231","REV0048052","1","続編が読みたいのでみんな買え","単体でも楽しめる作品だが、作中で続編の「10日後告白するメンヘラギャル」がアナウンスされている。\nそれを踏まえて読み返すと「起承転結」の「起」か「承」くらいで終わってしまっている印象になる。\nぜひ続きが読みたいので、興味を持った人は購入して作者のモチベーションを上げて欲しい。\n\n内容は「恋愛感情を理解できない女の子が、恋人関係を通じてちょっとずつ恋心を芽生えさせる」という、文章にすると実にありきたりな内容である。\nただ、読みたいと思えるポイントはきっちり押さえている為、読み終わった後は「こういうのでいいんだよ」という満足感で満たされる。\n\nそれとタイトルから想像するほど、後輩の女の子はギャルでも無ければ10日後にメンヘラにもならない。\n「愛情に飢えた女の子が好きな人に執着しました」という事を「メンヘラ」と表しているだけで、そこにはメンヘラの身勝手さや醜さよりも可愛らしさや微笑ましさを強く感じるキャラクター性である。\nむしろ告白されて付き合う前の方がメンヘラ感は強い。\n人によってはそこで解釈違いが起きるかもしれない。\n\nとにかく青春ものとしては出来が凄くいいので、「メンヘラ」という単語に尻込みせずに購入して欲しい。","2023-07-02 23:01:53","2023-07-04 16:33:22","0","ペンギンハイウェイスター","4","active",40,{"206":330,"400":331,"060":332,"001":333,"014":334,"032":98,"013":335},"Girl","Student","Woman's Viewpoint","School \u002F Academy","Lovers","Heartwarming","ja_JP",[338],{"locale":339,"title":340,"text":341},"en_US","I want to read the sequel, so everyone buy this.","This work is enjoyable even on its own, however the sequel \"Mentally Unstable Gal Who Confesses 10 Days Later\" is announced within this story.\nWhen you re-read this knowing that, you get the impression that this story only ends at around the 'introduction' or 'development' stage of standard story structure.\nI really want to read the continuation, so if this interests you, please purchase it to support the author's motivation.\n\nThe premise is very ordinary when written out: a girl who cannot understand romantic feelings gradually begins to develop love while being in a dating relationship.\nHowever, all the elements that make this kind of story enjoyable are properly executed, so after finishing reading you will be left with the satisfied feeling that \"this is exactly what I wanted\".\n\nAlso, contrary to what you might imagine from the title, the underclassman girl is not a gal, nor does she become mentally unstable 10 days later.\nThe term 'mentally unstable' is only used here to describe a girl starved for affection who becomes attached to the person she likes. Far from the selfishness or unpleasantness usually associated with that term, this character comes across as endearing and heartwarming.\nIf anything, she gives off a stronger 'mentally unstable' vibe before they start dating after the confession.\nSome people may feel misled by the title for this reason.\n\nAll that said, this is an extremely well made youth romance story. Please do not be put off by the 'mentally unstable' label and give this work a chance.",{"member_review_id":343,"workno":10,"reviewer_id":344,"status":319,"recommend":30,"spoiler":20,"review_title":345,"review_text":346,"entry_date":347,"regist_date":348,"good_review":349,"bad_review":324,"circle_id":47,"nick_name":350,"popularity":351,"rate":352,"circle_name":147,"top_sort_key":319,"reviewer_status":327,"is_purchased":30,"rate_num":353,"reviewer_rank":354,"longtext":30,"original_lang":336,"translations":355,"pickup":20},"1189836","REV0086837","続編待たざるを得ない","メンヘラ(?)なギャルとのラブコメです。青春の10日間が濃いめに描かれています。\n\nタイトル通り、9日間はメンヘラとはほぼ無縁です。少々拗らせているようにも思える理由で付き合い始めますが、男側が手順を大切にするタイプだったためにその目論見は潰れ、一先ずは普通の付き合いをします。凄いハイペースな詰め方で。\n\n恋愛感情というものが解せないギャルが少々真面目すぎる男との付き合いを通じてその感情を学ぶ姿に心が洗われるような気持でした。\n\nさて、ここから告白まであと10日もかかるようです。なにせ、今どき恋文から始めるような男ですから。","2023-09-07 00:14:01","2023-09-08 09:54:11",7,"日向ななな",116,"5",50,"Best200",[356],{"locale":339,"title":357,"text":358},"I have no choice but to wait for the sequel","This is a romantic comedy with a supposedly emotionally unstable gal. Ten days of youth are depicted in a very dense manner.\n\nAs the title suggests, for the first 9 days there is almost nothing related to the supposed instability. They start dating for reasons that seem a little warped, but since the guy is the type who values taking things step by step, that original plan falls apart, and they end up having a normal relationship for the time being. Albeit at an extremely fast pace.\n\nWatching this gal who does not understand romantic feelings learn about such emotions through dating this overly serious guy left me feeling like my heart had been cleansed.\n\nIt looks like it will take another full 10 days from this point until the confession. After all, this is the kind of guy who still starts things off with a love letter these days.",{"member_review_id":360,"workno":10,"reviewer_id":361,"status":319,"recommend":30,"spoiler":30,"review_title":362,"review_text":363,"entry_date":364,"regist_date":365,"good_review":85,"bad_review":324,"circle_id":47,"nick_name":366,"popularity":8,"rate":352,"circle_name":147,"top_sort_key":319,"reviewer_status":327,"is_purchased":30,"rate_num":353,"reviewer_rank":7,"longtext":20,"genre":367,"original_lang":336,"translations":370,"pickup":20},"1042630","REV0117248","愛を知らない女の子の恋","恋を知らない女の子との関係を綴った物語です。\nヒロインは処女を卒業したいためだけで主人公と関わり始めますが、少しずつ主人公の優しさに触れてゆく事で心の中で変化が起こってゆき…というストーリ\nヒロインの心の変化を優しいタッチで愛らしく描かれており、純愛好きの方にも可愛いイラストが好きな方にもおすすめできる作品です!","2023-02-27 23:12:29","2023-03-04 17:31:02","名無しのネコ",{"455":368,"007":369,"032":98,"013":335},"Love Comedy \u002F Romcom","Comedy",[371],{"locale":339,"title":372,"text":373},"Love of a girl who does not know love","This is a story depicting the relationship with a girl who has never known love.\nThe heroine only starts getting involved with the protagonist because she wants to stop being a virgin, but as she gradually experiences the protagonist's kindness, changes begin to take place inside her heart...\nThe heroine's emotional changes are portrayed endearingly with a gentle touch. This is a work that can be recommended both for people who love pure romance and for people who enjoy cute artwork!",{"member_review_id":375,"workno":10,"reviewer_id":376,"status":319,"recommend":30,"spoiler":30,"review_title":377,"review_text":378,"entry_date":379,"regist_date":380,"good_review":119,"bad_review":324,"circle_id":47,"nick_name":381,"popularity":382,"rate":352,"circle_name":147,"top_sort_key":319,"reviewer_status":327,"is_purchased":30,"rate_num":353,"reviewer_rank":383,"longtext":30,"genre":384,"original_lang":336,"translations":385,"pickup":20},"1101587","REV0084007","ただただ尊い!","恋愛に疎く、感情も乏しい美少女JKが一途な男子と過ごす内に人間らしくなっていく。\nヒロインは自分自身に価値を見出していないようで、大して仲良くもない相手を平気で自宅に招き入れて身体を差し出そうとする危うい性格が退廃的である。また、軽々しくキスをしたり、ノーブラで学校に通うというあまりにも無防備なところがエロ可愛くてグッときた。\n中盤ではヒロインの自宅にお泊まりするイベントがあり、彼女の家庭的な一面も判明する。胸元が見えるラフな服装でエプロンを着ける様子に恋人感が漂っていてほのぼのした。\n徐々に笑顔が増えていくヒロインがやがて「好き」という感情を自覚し、同時に「嫉妬」の苦しみも理解するという展開には緊張感が満載だったが、結果的にはハッピーエンドだったので安心した。\nメンヘラといってもかなりソフトなメンヘラなので、タイトルではなくサンプルを見て購入を検討することをオススメする。","2023-05-19 23:28:24","2023-05-20 10:25:39","カリブ海",270,"Best300",{"400":331,"415":94,"001":333,"032":98},[386],{"locale":339,"title":387,"text":388},"Just absolutely precious!","A beautiful high school girl who is inexperienced with love and lacks emotion gradually becomes more human as she spends time with a devoted boy.\nThe heroine does not seem to find any value in herself. Her dangerous personality, where she casually invites people she is not even close with to her home and offers herself physically, feels decadent. Also, her completely unguarded traits like kissing lightly without hesitation or going to school without a bra were erotic and cute, it really got to me.\nIn the middle part there is an event where you stay overnight at the heroine's home, and you get to see her domestic side. The way she wore an apron over loose clothing that showed her chest gave a real girlfriend feeling, it was very warm and gentle.\nThe development where the heroine, who gradually starts smiling more, finally becomes aware of the feeling of love, and at the same time comes to understand the pain of jealousy, was full of tension. But in the end it was a happy ending so I was relieved.\nEven though she is described as mentally unstable, it is a very mild portrayal. I recommend checking the sample preview instead of just going by the title before deciding to purchase.",{"member_review_id":390,"workno":10,"reviewer_id":391,"status":319,"recommend":30,"spoiler":30,"review_title":392,"review_text":393,"entry_date":394,"regist_date":395,"good_review":116,"bad_review":324,"circle_id":47,"nick_name":396,"popularity":8,"rate":352,"circle_name":147,"top_sort_key":319,"reviewer_status":327,"is_purchased":30,"rate_num":353,"reviewer_rank":7,"longtext":30,"original_lang":336,"translations":397,"pickup":20},"1046368","REV0117575","内容絵柄良し!","内容と絵柄はとても良い!\n正直言うとページ数の割にお値段が高い感じはします。\nあまり同人誌を買うわけではないためあまり参考にはならないかな\n絵は使いまわしが少ないからとても手が込んでるんじゃないかなとも思ってます。\n内容も個人的にはとっても良かったです。\nメンヘラになった後、彼女たちがどうなっていくのかとても気になります。","2023-03-05 04:35:19","2023-03-12 12:41:35","hu-nn",[398],{"locale":339,"title":399,"text":400},"Content and artwork are great!","The content and artwork are really great!\nHonestly, I feel the price is high for the number of pages.\nThis probably won't be very helpful reference since I don't buy doujinshi often.\nThere is very little reused artwork, so I think a lot of care went into making this.\nPersonally I also thought the content was really good.\nI am very curious about what will happen to the girls after they become emotionally unstable.",{"member_review_id":402,"workno":10,"reviewer_id":403,"status":319,"recommend":30,"spoiler":20,"review_title":404,"review_text":405,"entry_date":406,"regist_date":407,"good_review":16,"bad_review":324,"circle_id":47
